<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#f7f2ec">
  <title>Wedding Snap · Photobooth</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📸</text></svg>">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,700;1,500&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <video class="bgVideo" src="css/background.mp4" poster="css/background.jpg"
         autoplay muted loop playsinline aria-hidden="true"></video>

  <!-- Music on/off: a mini CD on every screen except home (home has the big one) -->
  <button id="musicBtn" class="musicBtn" aria-label="Toggle music">
    <span class="miniCd"></span>
  </button>

  <!-- Welcome cover. Phones only allow music after the first tap, so this
       invites that tap (hidden when the browser allows autoplay) -->
  <div class="intro hidden" id="intro" role="button" tabindex="0" aria-label="Open the photobooth">
    <div class="introCard">
      <p class="eyebrow">Welcome to our</p>
      <h1 class="display detail" id="introTitle"></h1>
      <span class="introRecord" aria-hidden="true"></span>
      <p class="introCouple detail" id="introCouple"></p>
      <p class="introDate detail" id="introDate"></p>
      <span class="introTap">Tap to open&nbsp;&nbsp;♪</span>
    </div>
  </div>

  <!-- ===================== 1. HOME ===================== -->
  <section class="screen active" id="home">
    <div class="home-inner">
      <p class="eyebrow">Welcome to our</p>
      <h1 class="display detail" id="homeTitle"></h1>
      <p class="couple detail" id="homeCouple"></p>

      <!-- CD sliding out of its sleeve; spins while the music plays. Tap = play / pause -->
      <button class="cdPlayer" id="cdPlayer" aria-label="Play or pause music">
        <span class="cd" aria-hidden="true">
          <span class="cdLabel"><b class="cdMono"></b></span>
        </span>
        <span class="sleeve" aria-hidden="true">
          <b class="cdMono"></b>
          <small class="detail" id="sleeveDate"></small>
        </span>
      </button>
      <p class="nowPlaying">
        <small id="npState">Tap the record for music</small>
        <span id="npTitle">&nbsp;</span>
      </p>

      <p class="lede">Capture the day from your point of view.<br>Every photo goes straight to the couple's album.</p>

      <button class="btn primary big" id="homeStart">Start photobooth</button>
      <button class="btn ghost" id="homeGallery">View gallery</button>
    </div>
  </section>

  <!-- ===================== 2. LAYOUT ===================== -->
  <section class="screen" id="layout">
    <header class="topbar">
      <button class="iconBtn" data-go="home" aria-label="Back">←</button>
      <span>Choose a layout</span>
      <span class="spacer"></span>
    </header>
    <div class="layoutGrid" id="layoutGrid"><!-- built by JS --></div>
  </section>

  <!-- ===================== 3. BOOTH (camera) ===================== -->
  <section class="screen dark" id="booth">
    <header class="topbar">
      <button class="iconBtn" id="boothBack" aria-label="Back">←</button>
      <span id="boothTitle">Shot 1 of 4</span>
      <button class="iconBtn" id="flipBtn" aria-label="Switch camera">⟲</button>
    </header>

    <div class="viewfinderWrap">
      <div id="viewfinder">
        <video id="camera" autoplay playsinline muted></video>
        <div id="countdown"><span id="countNum"></span><small id="countHint">Get ready</small></div>
        <div id="flash"></div>
        <div id="camError" class="hidden">
          <p id="camErrTitle">Camera not available</p>
          <small id="camErrHelp"></small>
          <div class="row">
            <button class="btn small light" id="camRetry">Try again</button>
            <label class="btn small outline" for="pickFile">Choose from gallery</label>
          </div>
        </div>
      </div>
    </div>

    <div class="slotDots" id="slotDots"><!-- built by JS --></div>

    <div class="chips" id="liveFilters"><!-- built by JS --></div>

    <div class="shutterRow">
      <button class="sideBtn" id="timerBtn" aria-label="Countdown timer">3s</button>
      <button class="shutter" id="shutterBtn" aria-label="Take photo"><span></span></button>
      <label class="sideBtn" aria-label="Pick from gallery">
        ⧉
        <input type="file" id="pickFile" accept="image/*" hidden>
      </label>
    </div>
  </section>

  <!-- ===================== 4. EDIT ===================== -->
  <section class="screen" id="edit">
    <header class="topbar">
      <button class="iconBtn" id="editBack" aria-label="Retake all">↺</button>
      <span>Make it yours</span>
      <span class="spacer"></span>
    </header>

    <div class="previewWrap">
      <canvas id="preview"></canvas>
    </div>
    <p class="tip">Tap a photo to retake it</p>

    <div class="panel">
      <h3>Frame</h3>
      <div class="chips" id="frameChips"></div>
      <h3>Filter</h3>
      <div class="chips" id="filterChips"></div>
    </div>

    <div class="bottomBar">
      <button class="btn primary big" id="doneBtn">Done · Send to album</button>
    </div>
  </section>

  <!-- ===================== 5. RESULT ===================== -->
  <section class="screen" id="result">
    <div class="result-inner">
      <div class="printSlot">
        <img id="resultImg" alt="Your photo">
      </div>
      <p class="uploadStatus" id="uploadStatus"></p>

      <div class="row">
        <button class="btn primary" id="saveBtn">Save to phone</button>
        <button class="btn ghost" id="againBtn">Take another</button>
      </div>
      <button class="btn link" data-go="gallery">See everyone's photos →</button>
    </div>
  </section>

  <!-- ===================== 6. GALLERY ===================== -->
  <section class="screen" id="gallery">
    <header class="topbar">
      <button class="iconBtn" data-go="home" aria-label="Back">←</button>
      <span>Gallery</span>
      <button class="iconBtn" id="refreshBtn" aria-label="Refresh">⟳</button>
    </header>
    <div class="tabs">
      <button class="tab active" data-tab="all">Everyone</button>
      <button class="tab" data-tab="mine">Mine</button>
    </div>
    <p class="galleryMsg" id="galleryMsg"></p>
    <div class="masonry" id="galleryGrid"></div>
  </section>

  <!-- Lightbox for one gallery photo -->
  <!-- Swipe left/right between photos; tap outside, ✕ or the phone's Back to close -->
  <div class="lightbox hidden" id="lightbox">
    <div class="lbTop">
      <span id="lbCount"></span>
      <button class="iconBtn" id="lbClose" aria-label="Close">✕</button>
    </div>
    <div class="lbStage" id="lbStage">
      <button class="lbNav" id="lbPrev" aria-label="Previous photo">‹</button>
      <img id="lbImg" alt="">
      <button class="lbNav" id="lbNext" aria-label="Next photo">›</button>
    </div>
    <div class="row">
      <button class="btn primary" id="lbSave">Save</button>
      <button class="btn danger hidden" id="lbDelete">Delete my upload</button>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="js/config.js"></script>
  <script src="js/filters.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
