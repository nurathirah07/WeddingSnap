# On every push to main: find the chorus of new songs in music/,
# then publish the site to GitHub Pages.
# One-time setup: repo Settings → Pages → Source: "GitHub Actions".
name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Find song highlights
        run: |
          npm ci
          npm run build

      - name: Collect website files
        run: |
          mkdir _site
          cp -r index.html admin.html slideshow.html settings.json manifest.webmanifest sw.js icons css js music tools _site/
          # New version number on every deploy, so phones never mix an old
          # cached style.css / app.js with the new page
          sed -i "s/?v=dev/?v=${GITHUB_SHA::8}/g" _site/index.html _site/admin.html _site/slideshow.html _site/js/admin.js _site/sw.js

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
