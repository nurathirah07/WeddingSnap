<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Song highlights</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 760px; margin: 30px auto; padding: 0 16px; color: #1f1a17; background: #f7f2ec; }
    h1 { font-weight: 600; }
    .song { background: #fff; border-radius: 12px; padding: 14px 16px; margin: 12px 0; }
    .song b { display: block; margin-bottom: 4px; }
    button { margin: 8px 4px 0 0; padding: 6px 12px; border-radius: 99px; border: 1px solid #1f1a17; background: #fff; cursor: pointer; }
    .muted { color: #8a7d74; font-size: 14px; }
  </style>
</head>
<body>
  <h1>🎵 Song highlights</h1>
  <p class="muted">
    Listen to the chorus times found for each song in <code>music/songs.json</code>.
    Don't like one? Change the numbers (in seconds) in <code>music/songs.json</code>.
  </p>
  <div id="list"></div>

  <script>
    const player = new Audio();
    const fmt = (s) => Math.floor(s / 60) + ":" + String(Math.floor(s % 60)).padStart(2, "0");

    fetch("../music/songs.json", { cache: "no-cache" })
      .then((res) => res.json())
      .then(({ songs }) => songs.forEach((song) => {
        const box = document.createElement("div");
        box.className = "song";
        box.innerHTML = `<b>${song.src.replace("music/", "")}</b>
          <span class="muted">Length ${fmt(song.duration)}</span><br>`;
        song.highlights.forEach((t) => {
          const b = document.createElement("button");
          b.textContent = "▶ " + fmt(t);
          b.onclick = () => { player.src = "../" + encodeURI(song.src); player.currentTime = t; player.play(); };
          box.appendChild(b);
        });
        const stop = document.createElement("button");
        stop.textContent = "■ stop";
        stop.onclick = () => player.pause();
        box.appendChild(stop);
        document.getElementById("list").appendChild(box);
      }))
      .catch(() => {
        document.getElementById("list").textContent = "No music/songs.json yet - run: npm run music";
      });
  </script>
</body>
</html>
