<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Wedding Snap · Live slideshow</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%232a1f22'/%3E%3Ccircle cx='32' cy='32' r='11' fill='%23e7a6bf'/%3E%3Ccircle cx='32' cy='32' r='3' fill='%23f8f1ee'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=dev">
  <link rel="stylesheet" href="css/slideshow.css?v=dev">
</head>
<!-- Live slideshow for a TV / projector: new photos appear as guests
     take them, with their wishes. Click once to go full screen. -->
<body class="show">
  <div class="stage" id="stage"></div>

  <header class="showBrand">
    <span class="showMono" id="showMono"></span>
    <span class="showMeta">
      <b id="showTitle"></b>
      <small id="showDate"></small>
    </span>
  </header>

  <aside class="showJoin">
    <span class="showQr" id="showQr"></span>
    <span>Scan to join<br>the photobooth</span>
  </aside>

  <p class="showCount" id="showCount"></p>

  <!-- before the first photo -->
  <div class="showEmpty hidden" id="showEmpty">
    <p class="eyebrow">Welcome to our</p>
    <h1 class="display" id="emptyTitle"></h1>
    <p class="couple" id="emptyCouple"></p>
    <span class="showQr big" id="emptyQr"></span>
    <p class="showEmptyHint">Scan to take a photo and leave a wish.<br>It will appear here.</p>
  </div>

  <p class="showHint" id="showHint">Click anywhere for full screen</p>

  <script src="js/config.js?v=dev"></script>
  <script src="js/vendor/qrcode.js?v=dev"></script>
  <script src="js/qr.js?v=dev"></script>
  <script src="js/slideshow.js?v=dev"></script>
</body>
</html>
